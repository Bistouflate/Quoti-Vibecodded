<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quoti</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF5C7A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quoti">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-alt:#F7F7FA;
    --paper-alt2:#EDEDF2;
    --ink:#3C3C43;
    --ink-soft:#8A8A93;
    --line:#E4E4EA;
    --line-strong:#D3D3DC;

    --teal:#4CAF6D; --teal-deep:#2F8F52;
    --rose:#F5A623; --rose-deep:#CC8400;
    --sky:#3DA5F4; --sky-deep:#1E85D6;
    --sport:#FF9142; --sport-deep:#E6752A;
    --program:#8B5FE6; --program-deep:#6E42C7;
    --summary:#FF5C7A; --summary-deep:#E0405F;

    --radius: 12px;
    --font-display: 'Baloo 2', 'Nunito', -apple-system, sans-serif;
    --font-body: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#1B1C20;
      --paper-alt:#26272C;
      --paper-alt2:#303136;
      --ink:#F2F1F5;
      --ink-soft:#A8A8B3;
      --line:#3A3B41;
      --line-strong:#47484F;
      --teal:#5FCB86; --teal-deep:#3E9C63;
      --rose:#FFBB55; --rose-deep:#D99429;
      --sky:#63B8F7; --sky-deep:#3D97DE;
      --sport:#FFA35D; --sport-deep:#E9843A;
      --program:#A886F2; --program-deep:#8763D9;
      --summary:#FF7D96; --summary-deep:#E85B77;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1C20;
    --paper-alt:#26272C;
    --paper-alt2:#303136;
    --ink:#F2F1F5;
    --ink-soft:#A8A8B3;
    --line:#3A3B41;
    --line-strong:#47484F;
    --teal:#5FCB86; --teal-deep:#3E9C63;
    --rose:#FFBB55; --rose-deep:#D99429;
    --sky:#63B8F7; --sky-deep:#3D97DE;
    --sport:#FFA35D; --sport-deep:#E9843A;
    --program:#A886F2; --program-deep:#8763D9;
    --summary:#FF7D96; --summary-deep:#E85B77;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  button{font-family:inherit;}
  input, textarea, select{font-family:inherit; color:inherit;}
  :focus-visible{outline:3px solid var(--sky); outline-offset:2px;}
  .app{max-width:920px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  /* Topbar */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 8px;
  }
  .brand{
    font-family:var(--font-display);
    font-weight:800;
    font-size:1.6rem;
    letter-spacing:0.2px;
  }
  .brand .dot{color:var(--summary);}
  .stats-pill{
    display:flex; align-items:center; gap:7px;
    background:var(--rose);
    color:#fff;
    border:none;
    box-shadow: 0 3px 0 var(--rose-deep);
    border-radius:999px;
    padding:8px 16px;
    font-size:0.95rem;
    font-weight:800;
    white-space:nowrap;
  }
  .stats-pill .flame{font-size:1.1rem;}

  /* Bottom nav bar - fixed, single row, Duolingo-style */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; margin:0 auto;
    max-width:920px;
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap:2px;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
    background:var(--paper);
    border-top:2px solid var(--line);
    box-shadow: 0 -3px 12px rgba(0,0,0,0.05);
    z-index:50;
  }
  .tab-btn{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    appearance:none; border:none; background:transparent;
    padding:3px 2px 4px;
    border-radius:14px;
    cursor:pointer;
    transition: transform .08s ease;
  }
  .tab-btn:active{transform:scale(0.93);}
  .tab-icon{
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:1.2rem; line-height:1;
    background:var(--paper-alt2);
    border:2.5px solid var(--line);
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .tab-label{font-size:0.58rem; font-weight:700; color:var(--ink-soft); white-space:normal; text-align:center; line-height:1.1; max-width:64px;}
  .tab-btn.active .tab-label{color:var(--ink);}
  .tab-btn[data-tab="summary"].active .tab-icon{background:var(--summary); border-color:var(--summary); transform:scale(1.08); box-shadow:0 3px 0 var(--summary-deep);}
  .tab-btn[data-tab="tasks"].active .tab-icon{background:var(--teal); border-color:var(--teal); transform:scale(1.08); box-shadow:0 3px 0 var(--teal-deep);}
  .tab-btn[data-tab="program"].active .tab-icon{background:var(--program); border-color:var(--program); transform:scale(1.08); box-shadow:0 3px 0 var(--program-deep);}
  .tab-btn[data-tab="goals"].active .tab-icon{background:var(--sky); border-color:var(--sky); transform:scale(1.08); box-shadow:0 3px 0 var(--sky-deep);}
  .tab-btn[data-tab="sport"].active .tab-icon{background:var(--sport); border-color:var(--sport); transform:scale(1.08); box-shadow:0 3px 0 var(--sport-deep);}
  .tab-btn[data-tab="progress"].active .tab-icon{background:var(--rose); border-color:var(--rose); transform:scale(1.08); box-shadow:0 3px 0 var(--rose-deep);}

  main.content{flex:1; padding:18px 20px calc(110px + env(safe-area-inset-bottom, 0px));}
  .tab-panel{display:none;}
  .tab-panel.active{display:block; animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;}}

  .panel-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .panel-title{font-family:var(--font-display); font-size:1.4rem; font-weight:700;}
  .panel-sub{color:var(--ink-soft); font-size:0.85rem; font-weight:600;}

  .btn{
    appearance:none; border:none; background:var(--teal); color:#fff;
    font-weight:800; font-size:0.88rem;
    padding:12px 18px; border-radius:14px; cursor:pointer;
    box-shadow:0 4px 0 var(--teal-deep);
    transition: transform .05s ease, box-shadow .05s ease, filter .1s ease;
  }
  .btn:hover{filter:brightness(1.04);}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--teal-deep);}
  .btn.ghost{background:var(--paper-alt); color:var(--ink); border:2px solid var(--line-strong); box-shadow:0 4px 0 var(--line-strong);}
  .btn.small{padding:8px 13px; font-size:0.78rem; border-radius:12px; box-shadow:0 3px 0 var(--teal-deep);}
  .btn.small.ghost{box-shadow:0 3px 0 var(--line-strong);}
  .btn.danger{background:var(--summary); color:#fff; box-shadow:0 4px 0 var(--summary-deep);}
  .btn.small.danger{box-shadow:0 3px 0 var(--summary-deep);}
  .btn.sport-done{background:var(--sport); box-shadow:0 4px 0 var(--sport-deep);}
  .btn.small.sport-done{box-shadow:0 3px 0 var(--sport-deep);}

  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

  /* Summary */
  .summary-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px;}
  .summary-card{border:2px solid var(--line); border-radius:18px; padding:16px 18px; background:var(--paper-alt); border-top:7px solid var(--summary);}
  .summary-card.accent-tasks{border-top-color:var(--teal);}
  .summary-card.accent-program{border-top-color:var(--program);}
  .summary-card.accent-sport{border-top-color:var(--sport);}
  .summary-card-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; cursor:pointer; margin-bottom:12px;}
  .summary-card-head:hover .summary-card-title{text-decoration:underline;}
  .summary-card-title{font-family:var(--font-display); font-weight:700; font-size:1.08rem;}
  .summary-card-count{font-size:0.8rem; color:var(--ink-soft); font-weight:800; white-space:nowrap;}
  .summary-list{display:flex; flex-direction:column; gap:10px;}
  .summary-row{display:flex; align-items:center; gap:9px; font-size:0.88rem;}
  .summary-row-text{flex:1; min-width:0; font-weight:600;}
  .summary-card.accent-program .summary-row-text{white-space:pre-wrap;}
  .summary-row-text.done{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line);}
  .summary-empty{font-size:0.85rem; color:var(--ink-soft); font-weight:600;}
  .summary-tag{
    font-size:0.66rem; font-weight:800; color:var(--ink-soft); background:var(--paper);
    border:1.5px solid var(--line); border-radius:999px; padding:3px 9px; white-space:nowrap; flex:0 0 auto;
  }
  .summary-tag.today{color:#fff; background:var(--program); border-color:var(--program);}
  .task-check.small{width:22px; height:22px; font-size:0.75rem; flex:0 0 auto;}

  /* Tasks */
  .task-add{display:flex; gap:8px; margin-bottom:18px; align-items:flex-end;}
  .task-add textarea{
    flex:1; border:2px solid var(--line); background:var(--paper-alt);
    padding:11px 14px; border-radius:var(--radius); font-size:0.95rem; font-weight:600;
    font-family:inherit; resize:none; overflow:hidden; min-height:44px; max-height:200px; line-height:1.4;
  }
  .task-list{display:flex; flex-direction:column; gap:2px;}
  .task-row{
    display:flex; align-items:flex-start; gap:12px;
    padding:12px 4px;
    border-bottom:2px solid var(--line);
  }
  .task-row .task-check, .task-row .task-del, .task-row .order-controls{margin-top:2px;}
  .task-check{
    width:28px; height:28px; flex:0 0 auto;
    border:2.5px solid var(--line-strong); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; background:var(--paper);
    color:transparent; font-weight:800;
    transition: background .12s ease, border-color .12s ease, transform .08s ease;
  }
  .task-check:active{transform:scale(0.88);}
  .task-check.done{background:var(--teal); border-color:var(--teal); color:#fff;}
  .task-text{
    flex:1; font-size:0.97rem; font-weight:600; white-space:pre-wrap;
    border:none; background:transparent; color:var(--ink); font-family:inherit;
    resize:none; overflow:hidden; padding:4px 0; line-height:1.4;
  }
  .task-text.done{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line);}
  .task-del{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:1.2rem; padding:4px 6px; opacity:0.55;}
  .task-del:hover{opacity:1; color:var(--summary);}
  .task-empty{padding:30px 6px; color:var(--ink-soft); font-size:0.92rem; font-weight:600;}
  .task-foot{margin-top:16px; font-size:0.85rem; color:var(--ink-soft); font-weight:600;}

  .file-label{
    border:2px dashed var(--line-strong); border-radius:var(--radius); padding:9px 13px; font-size:0.82rem;
    cursor:pointer; color:var(--ink-soft); font-weight:700;
  }
  .file-label input{display:none;}

  /* Progress */
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-bottom:22px;}
  .stat-box{border:2px solid var(--line); border-top:6px solid var(--rose); padding:14px 16px; border-radius:16px; background:var(--paper-alt);}
  .stat-num{font-family:var(--font-display); font-size:1.6rem; font-weight:800;}
  .stat-label{font-size:0.76rem; color:var(--ink-soft); margin-top:2px; font-weight:700;}
  .backup-block{border-top:2px solid var(--line); padding-top:18px; margin-top:6px;}
  .backup-title{font-size:1.05rem; margin-bottom:6px;}
  .backup-sub{margin-bottom:12px; font-weight:600;}
  .backup-row{align-items:center;}
  .trash-block{border-top:2px solid var(--line); padding-top:18px; margin-top:22px;}
  .trash-list{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .trash-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    border:2px solid var(--line); border-radius:14px; padding:10px 12px; background:var(--paper-alt);
  }
  .trash-main{min-width:0; flex:1;}
  .trash-text{font-size:0.9rem; font-weight:700; white-space:pre-wrap; overflow-wrap:anywhere; max-height:4.4em; overflow:hidden;}
  .trash-meta{font-size:0.72rem; color:var(--ink-soft); font-weight:600; margin-top:2px;}
  .trash-actions{margin-top:2px;}

  /* Reordering */
  .order-controls{display:flex; flex-direction:column; gap:3px; flex:0 0 auto;}
  .order-btn{
    width:24px; height:17px; border:none; background:var(--paper-alt2); border-radius:5px;
    font-size:0.6rem; line-height:1; color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .order-btn:disabled{opacity:0.25; cursor:default;}
  .order-btn:not(:disabled):active{transform:scale(0.9);}
  .order-btn:not(:disabled):hover{color:var(--ink);}

  /* Task history */
  .history-section{margin-top:28px;}
  .history-title{font-family:var(--font-display); font-weight:700; font-size:1.05rem; margin-bottom:10px; color:var(--ink-soft);}
  .history-day{padding:10px 0; border-bottom:2px solid var(--line);}
  .history-date{font-size:0.8rem; font-weight:700; color:var(--ink-soft); margin-bottom:6px; text-transform:capitalize;}
  .history-tasks{display:flex; flex-wrap:wrap; gap:6px;}
  .history-tag{
    font-size:0.78rem; background:var(--paper); border:1.5px solid var(--line); color:var(--ink-soft); font-weight:600;
    border-radius:999px; padding:4px 10px;
  }
  .history-tag.done{background:var(--teal); border-color:var(--teal); color:#fff; font-weight:700;}

  /* Goals */
  .goals-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:18px;}
  .goal-section{border:2px solid var(--line); border-top:7px solid var(--sky); border-radius:18px; padding:16px; background:var(--paper-alt);}
  .goal-heading-row{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:12px;}
  .goal-heading{font-family:var(--font-display); font-weight:700; font-size:1.05rem; color:var(--sky);}
  .goal-count{
    font-size:0.78rem; font-weight:800; color:var(--sky); background:var(--paper);
    border:1.5px solid var(--sky); border-radius:999px; padding:2px 9px; flex:0 0 auto;
  }
  .goal-add{display:flex; gap:8px; margin-bottom:12px; align-items:flex-end;}
  .goal-add textarea{
    flex:1; border:2px solid var(--line); font-family:inherit;
    background:var(--paper); padding:9px 12px; border-radius:var(--radius); font-size:0.88rem; font-weight:600;
    resize:none; overflow:hidden; min-height:38px; max-height:180px; line-height:1.4;
  }

  /* Program */
  .program-add{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; align-items:flex-end;}
  .program-add textarea{
    flex:1; min-width:140px; border:2px solid var(--line); font-family:inherit;
    background:var(--paper-alt); padding:11px; border-radius:var(--radius); font-size:0.95rem; font-weight:600;
    resize:none; overflow:hidden; min-height:44px; max-height:200px; line-height:1.4;
  }
  .program-add input[type="date"], .program-date{
    border:2px solid var(--line); border-radius:var(--radius); padding:9px; font-size:0.82rem; font-weight:600;
    background:var(--paper); color:var(--ink); flex:0 0 auto;
  }
  .program-row{display:flex; align-items:flex-start; gap:10px; padding:12px 4px; border-bottom:2px solid var(--line);}
  .program-row .task-check, .program-row .task-del{margin-top:2px;}
  .program-row .program-date{margin-top:0;}
  .program-text{
    flex:1; border:none; background:transparent; font-size:0.95rem; padding:6px 0; color:var(--ink); font-weight:600;
    font-family:inherit; resize:none; overflow:hidden; line-height:1.4;
  }
  .program-text.done{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line);}

  /* Calendar */
  .cal-nav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .cal-title{font-family:var(--font-display); font-weight:700; font-size:1.15rem; text-transform:capitalize;}
  .cal-arrow{min-width:40px; font-size:1.1rem; line-height:1;}
  .cal-grid{
    display:grid; grid-template-columns:repeat(7, 1fr); gap:1px;
    background:var(--line); border:2px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:20px;
  }
  .cal-dow{background:var(--paper-alt); text-align:center; padding:8px 0; font-size:0.68rem; font-weight:800; color:var(--ink-soft); text-transform:uppercase;}
  .cal-cell{background:var(--paper); min-height:54px;}
  .cal-empty{background:var(--paper-alt);}
  .cal-day{
    appearance:none; border:none; cursor:pointer; font-family:inherit; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:4px; padding:5px 2px;
  }
  .cal-day:active{filter:brightness(0.95);}
  .cal-num{
    width:28px; height:28px; border-radius:50%; border:2px solid transparent;
    display:flex; align-items:center; justify-content:center; font-size:0.88rem; font-weight:700;
  }
  .cal-day.today .cal-num{border-color:var(--program);}
  .cal-dot{width:8px; height:8px; border-radius:50%; background:var(--program);}
  .cal-day.selected{background:var(--program); color:#fff;}
  .cal-day.selected .cal-dot{background:#fff;}
  .cal-day.selected.today .cal-num{border-color:#fff;}
  .day-panel{border:2px solid var(--line); border-top:7px solid var(--program); border-radius:18px; padding:16px; background:var(--paper-alt);}
  .day-panel-title{font-family:var(--font-display); font-weight:700; font-size:1.05rem; margin-bottom:12px; color:var(--program); display:block;}
  .day-panel-title::first-letter{text-transform:uppercase;}
  .day-panel .program-add{margin-bottom:10px;}

  /* Sport */
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-bottom:16px;}
  .form-grid label{display:flex; flex-direction:column; font-size:0.76rem; color:var(--ink-soft); gap:5px; font-weight:700;}
  .form-grid input, .form-grid select{
    border:2px solid var(--line); border-radius:var(--radius); padding:9px; font-size:0.9rem; font-weight:600;
    background:var(--paper); color:var(--ink);
  }
  .bmi-box{
    display:inline-flex; gap:8px; align-items:baseline; background:var(--sport);
    color:#fff; border:none; padding:9px 16px; border-radius:999px; font-size:0.85rem; font-weight:700; margin-bottom:18px;
    box-shadow:0 3px 0 var(--sport-deep);
  }
  .bmi-box.bmi-box-muted{color:var(--ink-soft); font-size:0.82rem; border-radius:14px; display:block; background:var(--paper-alt); border:2px dashed var(--line-strong); box-shadow:none; font-weight:600;}
  .bmi-box .bmi-num{font-weight:800; font-family:var(--font-display); font-size:1.05rem;}
  .routine-meta{font-size:0.82rem; color:var(--ink-soft); margin-bottom:14px; font-weight:700;}
  .exercise-list{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
  .exercise-card{border:2px solid var(--line); border-left:7px solid var(--sport); border-radius:16px; padding:13px 16px; background:var(--paper-alt);}
  .exercise-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .exercise-name{font-family:var(--font-display); font-weight:700; font-size:1.02rem;}
  .exercise-muscle{font-size:0.74rem; color:var(--ink-soft); font-weight:600;}
  .exercise-dose{font-size:0.78rem; font-weight:800; color:var(--sport); white-space:nowrap;}
  .exercise-cue{font-size:0.84rem; color:var(--ink-soft); margin-top:6px; line-height:1.45; font-weight:500;}
  .sport-check-block{display:flex; align-items:center; gap:16px; flex-wrap:wrap; border-top:2px solid var(--line); padding-top:18px;}
  .sport-stat{font-size:0.82rem; color:var(--ink-soft); font-weight:700;}

  @media (max-width:560px){
    .brand{font-size:1.3rem;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">Quoti<span class="dot">.</span></div>
    <div class="stats-pill">
      <span class="flame" id="streak-flame">🔥</span><span id="streak-val">0</span>
    </div>
  </header>

  <main class="content">
    <section id="tab-summary" class="tab-panel active"></section>
    <section id="tab-tasks" class="tab-panel"></section>
    <section id="tab-program" class="tab-panel"></section>
    <section id="tab-goals" class="tab-panel"></section>
    <section id="tab-sport" class="tab-panel"></section>
    <section id="tab-progress" class="tab-panel"></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab-btn active" data-tab="summary"><span class="tab-icon">🏠</span><span class="tab-label">Résumé</span></button>
    <button class="tab-btn" data-tab="tasks"><span class="tab-icon">✅</span><span class="tab-label">Checklist</span></button>
    <button class="tab-btn" data-tab="program"><span class="tab-icon">🗓️</span><span class="tab-label">Programme</span></button>
    <button class="tab-btn" data-tab="goals"><span class="tab-icon">🎯</span><span class="tab-label">Tâches</span></button>
    <button class="tab-btn" data-tab="sport"><span class="tab-icon">💪</span><span class="tab-label">Sport</span></button>
    <button class="tab-btn" data-tab="progress"><span class="tab-icon">🏆</span><span class="tab-label">Progression</span></button>
  </nav>

</div>

<script id="quoti-state" type="application/json">{}</script>
<script id="app-script">
(function(){
  "use strict";
  var SHELL = document.documentElement.outerHTML;

  var state = null;
  var artifactNS = null;
  var downloadsNS = null;
  var activeTab = 'summary';
  var persistTimer = null;

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

  function ymd(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function todayStr(){ return ymd(new Date()); }
  function yesterdayStr(){ var d = new Date(); d.setDate(d.getDate()-1); return ymd(d); }
  function fmtDateLong(d){
    var jours = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
    var mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    return jours[d.getDay()] + ' ' + d.getDate() + ' ' + mois[d.getMonth()];
  }
  function fmtDateShort(d){
    var jours = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
    var mois = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
    return jours[d.getDay()] + ' ' + d.getDate() + ' ' + mois[d.getMonth()];
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function autoGrow(el){
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }
  function moveItem(arr, id, direction){
    var i = arr.findIndex(function(x){ return x.id === id; });
    if (i < 0) return;
    var j = i + direction;
    if (j < 0 || j >= arr.length) return;
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  function downloadFile(filename, content, mime){
    if (downloadsNS) {
      downloadsNS.save({filename: filename, data: content}).catch(function(e){ console.error(e); });
      return;
    }
    try {
      var blob = new Blob([content], {type: mime || 'text/plain;charset=utf-8;'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    } catch(e) {
      alert('Le téléchargement n\u2019est pas disponible ici.');
    }
  }

  function defaultState(){
    return {
      tasks: [],
      logs: {},
      streak: 0,
      longestStreak: 0,
      lastStreakDate: null,
      goals: { short: [], mid: [], long: [] },
      program: [],
      trash: [],
      sport: { profile: { height:'', weight:'', age:'', goal:'forme', level:'debutant' }, log: {} }
    };
  }

  function normalizeState(s){
    if (!s || typeof s !== 'object' || !s.tasks) s = defaultState();
    if (!s.tasks) s.tasks = [];
    if (!s.logs) s.logs = {};
    if (typeof s.streak !== 'number') s.streak = 0;
    if (typeof s.longestStreak !== 'number') s.longestStreak = 0;
    if (!s.goals) s.goals = { short: [], mid: [], long: [] };
    if (!s.goals.short) s.goals.short = [];
    if (!s.goals.mid) s.goals.mid = [];
    if (!s.goals.long) s.goals.long = [];
    if (!s.program) s.program = [];
    if (!Array.isArray(s.trash)) s.trash = [];
    if (!s.sport) s.sport = { profile: { height:'', weight:'', age:'', goal:'forme', level:'debutant' }, log: {} };
    if (!s.sport.profile) s.sport.profile = { height:'', weight:'', age:'', goal:'forme', level:'debutant' };
    if (!s.sport.log) s.sport.log = {};
    return s;
  }

  // ---------- Corbeille ----------
  var TRASH_DAYS = 30, TRASH_MAX = 100;
  function purgeTrash(){
    var limit = Date.now() - TRASH_DAYS * 24 * 3600 * 1000;
    state.trash = state.trash.filter(function(e){ return e && e.item && e.deletedAt >= limit; }).slice(0, TRASH_MAX);
  }
  function trashItem(kind, item, meta){
    var entry = {tid: uid(), kind: kind, item: JSON.parse(JSON.stringify(item)), deletedAt: Date.now()};
    if (meta) { Object.keys(meta).forEach(function(k){ entry[k] = meta[k]; }); }
    state.trash.unshift(entry);
    purgeTrash();
  }
  function trashLabel(e){
    var TERMS = {short:'court terme', mid:'moyen terme', long:'long terme'};
    if (e.kind === 'task') return 'Checklist';
    if (e.kind === 'goal') return 'Tâches (' + (TERMS[e.term] || '') + ')';
    if (e.kind === 'program') {
      if (!e.item.date) return 'Programme';
      return 'Programme (' + fmtDateShort(new Date(e.item.date + 'T00:00:00')) + ')';
    }
    return '';
  }
  function restoreFromTrash(tid){
    var idx = state.trash.findIndex(function(e){ return e.tid === tid; });
    if (idx < 0) return;
    var e = state.trash[idx];
    var arr = null;
    if (e.kind === 'task') arr = state.tasks;
    else if (e.kind === 'goal') { arr = state.goals[e.term]; if (!arr) { arr = state.goals[e.term] = []; } }
    else if (e.kind === 'program') arr = state.program;
    if (arr) {
      var at = (typeof e.index === 'number') ? Math.min(e.index, arr.length) : arr.length;
      arr.splice(at, 0, e.item);
    }
    state.trash.splice(idx, 1);
  }

  function loadInitialState(){
    var el = document.getElementById('quoti-state');
    var s = null;
    try { s = JSON.parse(el.textContent); } catch(e) {}
    return normalizeState(s);
  }

  function buildDocument(s){
    var json = JSON.stringify(s).replace(/<\/script/gi, '<\\/script');
    var newBlock = '<script id="quoti-state" type="application/json">' + json + '<' + '/script>';
    var newShell = SHELL.replace(/<script id="quoti-state"[^>]*>[\s\S]*?<\/script>/, newBlock);
    return '<!DOCTYPE html>\n' + newShell;
  }

  function schedulePersist(){
    clearTimeout(persistTimer);
    persistTimer = setTimeout(persist, 2500);
  }
  function persist(){
    clearTimeout(persistTimer);
    if (artifactNS) {
      artifactNS.publish(buildDocument(state)).catch(function(e){ console.error('publish failed', e); });
    } else {
      try { localStorage.setItem('quoti-state-v1', JSON.stringify(state)); } catch(e){}
    }
  }

  // ---------- Gamification (streak only) ----------
  function checkStreakDecay(){
    if (!state.lastStreakDate) return;
    var t = todayStr(), y = yesterdayStr();
    if (state.lastStreakDate !== t && state.lastStreakDate !== y) {
      state.streak = 0;
    }
  }

  function updateStreakAfterToggle(){
    var t = todayStr();
    var todays = state.logs[t] || [];
    var doneToday = state.tasks.length > 0 && state.tasks.every(function(task){ return todays.indexOf(task.id) >= 0; });
    if (doneToday && state.lastStreakDate !== t) {
      var y = yesterdayStr();
      state.streak = (state.lastStreakDate === y) ? state.streak + 1 : 1;
      state.lastStreakDate = t;
      state.longestStreak = Math.max(state.longestStreak, state.streak);
    } else if (!doneToday && state.lastStreakDate === t) {
      // undone after being marked complete today: roll back today's credit
      state.lastStreakDate = (state.streak > 1) ? yesterdayStr() : null;
      state.streak = Math.max(0, state.streak - 1);
    }
  }

  // ---------- Sport ----------
  var EXERCISES = {
    squats:       {name:'Squats', muscle:'Jambes et fessiers', cue:'Pieds largeur des épaules, descends comme pour t\u2019asseoir sur une chaise, dos droit, genoux dans l\u2019axe des pieds.', dose:{debutant:'10 répétitions', intermediaire:'15 répétitions', avance:'20 répétitions'}},
    fentes:       {name:'Fentes avant', muscle:'Jambes et fessiers', cue:'Un grand pas en avant, descends jusqu\u2019à ce que les deux genoux soient à 90°, reviens et alterne.', dose:{debutant:'8 répétitions / jambe', intermediaire:'12 répétitions / jambe', avance:'15 répétitions / jambe'}},
    pompes:       {name:'Pompes', muscle:'Poitrine, épaules, triceps', cue:'Mains un peu plus larges que les épaules, corps gainé, descends la poitrine vers le sol. Sur les genoux si besoin.', dose:{debutant:'8 répétitions (genoux au sol)', intermediaire:'12 répétitions', avance:'18 répétitions'}},
    planche:      {name:'Planche (gainage)', muscle:'Sangle abdominale', cue:'Appui sur les avant-bras et les pointes de pieds, corps aligné de la tête aux talons, ventre contracté.', dose:{debutant:'20 secondes', intermediaire:'40 secondes', avance:'60 secondes'}},
    pont_fessier: {name:'Pont fessier', muscle:'Fessiers et ischios', cue:'Allongé sur le dos, genoux pliés, pousse les hanches vers le haut en serrant les fessiers.', dose:{debutant:'10 répétitions', intermediaire:'15 répétitions', avance:'20 répétitions'}},
    superman:     {name:'Superman', muscle:'Bas du dos et fessiers', cue:'Allongé sur le ventre, lève bras et jambes en même temps, tiens la position puis relâche.', dose:{debutant:'10 répétitions', intermediaire:'15 répétitions', avance:'20 répétitions'}},
    mountain:     {name:'Mountain climbers', muscle:'Cardio et gainage', cue:'En position de planche, ramène alternativement les genoux vers la poitrine à un rythme soutenu.', dose:{debutant:'20 secondes', intermediaire:'30 secondes', avance:'45 secondes'}},
    jumping:      {name:'Jumping jacks', muscle:'Cardio complet', cue:'Saute en écartant bras et jambes, puis reviens à la position de départ, à rythme régulier.', dose:{debutant:'20 secondes', intermediaire:'30 secondes', avance:'45 secondes'}},
    burpees:      {name:'Burpees', muscle:'Cardio et corps entier', cue:'Squat, pose les mains au sol, envoie les pieds en planche, reviens et saute vers le haut.', dose:{debutant:'5 répétitions', intermediaire:'10 répétitions', avance:'15 répétitions'}},
    squat_saute:  {name:'Squat sauté', muscle:'Jambes, explosivité', cue:'Descends en squat puis saute le plus haut possible, atterris en souplesse et enchaîne.', dose:{debutant:'8 répétitions', intermediaire:'12 répétitions', avance:'18 répétitions'}},
    march_place:  {name:'Marche sur place', muscle:'Cardio doux', cue:'Lève les genoux alternativement à un rythme confortable, bras qui balancent naturellement.', dose:{debutant:'30 secondes', intermediaire:'45 secondes', avance:'60 secondes'}},
    step_up:      {name:'Montées sur marche', muscle:'Jambes et cardio doux', cue:'Monte et descends d\u2019une marche ou d\u2019un step à ton rythme, alterne le pied qui monte en premier.', dose:{debutant:'8 répétitions / jambe', intermediaire:'12 répétitions / jambe', avance:'16 répétitions / jambe'}},
    chair_squat:  {name:'Squat assisté (chaise)', muscle:'Jambes et fessiers, sans impact', cue:'Assieds-toi et relève-toi d\u2019une chaise sans t\u2019aider des mains, dos droit.', dose:{debutant:'8 répétitions', intermediaire:'12 répétitions', avance:'16 répétitions'}},
    wall_pushup:  {name:'Pompes contre un mur', muscle:'Poitrine, épaules, sans impact', cue:'Mains à plat sur un mur, recule les pieds, plie les coudes pour rapprocher la poitrine du mur.', dose:{debutant:'8 répétitions', intermediaire:'12 répétitions', avance:'16 répétitions'}}
  };
  var ROUTINES = {
    perte:  ['jumping','mountain','squats','burpees','squat_saute','planche'],
    muscle: ['squats','fentes','pompes','pont_fessier','superman','planche'],
    forme:  ['jumping','squats','pompes','fentes','planche','mountain']
  };
  var LOW_IMPACT_SWAP = { burpees:'step_up', squat_saute:'chair_squat', mountain:'march_place', jumping:'march_place', pompes:'wall_pushup' };
  var GOAL_LABELS = {perte:'Perte de poids', muscle:'Prise de muscle', forme:'Forme générale'};
  var LEVEL_LABELS = {debutant:'Débutant', intermediaire:'Intermédiaire', avance:'Avancé'};
  var LEVEL_META = {
    debutant:      {rounds:2, rest:'60 secondes de repos entre chaque exercice'},
    intermediaire: {rounds:3, rest:'45 secondes de repos entre chaque exercice'},
    avance:        {rounds:4, rest:'30 secondes de repos entre chaque exercice'}
  };
  function computeBMI(h, w){
    var hv = parseFloat(h), wv = parseFloat(w);
    if (!hv || !wv) return null;
    var m = hv / 100;
    return wv / (m * m);
  }
  function bmiCategory(b){
    if (b < 18.5) return 'Insuffisance pondérale';
    if (b < 25) return 'Poids normal';
    if (b < 30) return 'Surpoids';
    return 'Obésité';
  }
  function bmiTier(b){
    if (b == null) return null;
    if (b < 25) return 'normal';
    return 'impact_reduit';
  }
  function buildRoutineIds(goal, tier){
    var base = (ROUTINES[goal] || ROUTINES.forme).slice();
    if (tier !== 'impact_reduit') return base;
    var seen = {}, result = [];
    base.forEach(function(id){
      var swapped = LOW_IMPACT_SWAP[id] || id;
      if (!seen[swapped]) { seen[swapped] = true; result.push(swapped); }
    });
    var fillers = ['march_place','chair_squat','wall_pushup','step_up','planche','pont_fessier'];
    var fi = 0;
    while (result.length < 5 && fi < fillers.length) {
      if (!seen[fillers[fi]]) { seen[fillers[fi]] = true; result.push(fillers[fi]); }
      fi++;
    }
    return result;
  }
  function computeSportStreak(){
    var streak = 0;
    var d = new Date();
    if (!state.sport.log[todayStr()]) d.setDate(d.getDate() - 1);
    while (state.sport.log[ymd(d)]) { streak++; d.setDate(d.getDate() - 1); }
    return streak;
  }

  // ---------- Render ----------
  function render(){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === activeTab); });
    document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.toggle('active', p.id === 'tab-' + activeTab); });
    document.getElementById('streak-val').textContent = state.streak;
    document.getElementById('streak-flame').style.opacity = state.streak > 0 ? '1' : '0.35';
    renderSummary();
    renderTasks();
    renderProgram();
    renderGoals();
    renderSport();
    renderProgress();
  }

  function renderSummary(){
    var root = document.getElementById('tab-summary');
    var t = todayStr();
    var todays = state.logs[t] || [];
    var doneCount = state.tasks.filter(function(task){ return todays.indexOf(task.id) >= 0; }).length;

    var html = '<div class="panel-head"><div><div class="panel-title">Résumé</div>' +
      '<div class="panel-sub">' + escapeHtml(fmtDateLong(new Date())) + '</div></div></div>';
    html += '<div class="summary-grid">';

    // Tasks card
    html += '<div class="summary-card accent-tasks"><div class="summary-card-head" data-jump="tasks">' +
      '<span class="summary-card-title">Tâches du jour</span>' +
      (state.tasks.length ? '<span class="summary-card-count">' + doneCount + '/' + state.tasks.length + '</span>' : '') +
      '</div>';
    if (state.tasks.length === 0) {
      html += '<div class="summary-empty">Aucune tâche récurrente pour l\u2019instant.</div>';
    } else {
      html += '<div class="summary-list">';
      state.tasks.forEach(function(task){
        var done = todays.indexOf(task.id) >= 0;
        html += '<div class="summary-row">' +
          '<button class="task-check small' + (done?' done':'') + '" data-action="summary-toggle-task" data-id="' + task.id + '" aria-label="Marquer comme fait">' + (done?'✓':'') + '</button>' +
          '<span class="summary-row-text' + (done?' done':'') + '">' + escapeHtml(task.text) + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';

    // Program card
    var todayItems = state.program.filter(function(p){ return p.date === t; });
    html += '<div class="summary-card accent-program"><div class="summary-card-head" data-jump="program">' +
      '<span class="summary-card-title">Programme</span></div>';
    if (todayItems.length === 0) {
      html += '<div class="summary-empty">Rien de prévu aujourd\u2019hui.</div>';
    } else {
      html += '<div class="summary-list">';
      todayItems.forEach(function(it){
        html += '<div class="summary-row">' +
          '<span class="summary-row-text' + (it.done?' done':'') + '">' + escapeHtml(it.text) + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';

    // Sport card
    var sportDone = !!state.sport.log[t];
    html += '<div class="summary-card accent-sport"><div class="summary-card-head" data-jump="sport">' +
      '<span class="summary-card-title">Sport</span></div>' +
      '<button class="btn small' + (sportDone ? ' sport-done' : ' ghost') + '" id="summary-sport-btn">' +
      (sportDone ? '✓ Fait aujourd\u2019hui' : 'Pas encore fait aujourd\u2019hui') + '</button></div>';

    html += '</div>'; // summary-grid
    root.innerHTML = html;

    root.querySelectorAll('[data-jump]').forEach(function(el){
      el.addEventListener('click', function(){ setActiveTab(el.dataset.jump); render(); });
    });
    root.querySelectorAll('[data-action="summary-toggle-task"]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var id = btn.dataset.id;
        var tt = todayStr();
        if (!state.logs[tt]) state.logs[tt] = [];
        var idx = state.logs[tt].indexOf(id);
        if (idx >= 0) { state.logs[tt].splice(idx,1); } else { state.logs[tt].push(id); }
        updateStreakAfterToggle();
        render();
        schedulePersist();
      });
    });
    var sportBtn = document.getElementById('summary-sport-btn');
    if (sportBtn) {
      sportBtn.addEventListener('click', function(e){
        e.stopPropagation();
        state.sport.log[t] = !state.sport.log[t];
        render();
        schedulePersist();
      });
    }
  }

  function renderTasks(){
    var root = document.getElementById('tab-tasks');
    var t = todayStr();
    var todays = state.logs[t] || [];
    var doneCount = state.tasks.filter(function(task){ return todays.indexOf(task.id) >= 0; }).length;

    var html = '';
    html += '<div class="panel-head"><div><div class="panel-title">Checklist</div>' +
      '<div class="panel-sub">' + escapeHtml(fmtDateLong(new Date())) + '</div></div></div>';
    html += '<div class="task-add"><textarea id="new-task-input" placeholder="Ajouter une tâche récurrente…" maxlength="500" rows="1"></textarea>' +
      '<button class="btn" id="add-task-btn">Ajouter</button></div>';

    if (state.tasks.length === 0) {
      html += '<div class="task-empty">Aucune tâche pour l\u2019instant. Ajoute tes tâches habituelles une fois pour toutes — elles reviendront chaque jour.</div>';
    } else {
      html += '<div class="task-list">';
      state.tasks.forEach(function(task, idx){
        var done = todays.indexOf(task.id) >= 0;
        html += '<div class="task-row">' +
          '<button class="task-check' + (done?' done':'') + '" data-id="' + task.id + '" aria-label="Marquer comme fait">' + (done?'✓':'') + '</button>' +
          '<textarea class="task-text' + (done?' done':'') + '" data-id="' + task.id + '" rows="1">' + escapeHtml(task.text) + '</textarea>' +
          '<div class="order-controls">' +
          '<button class="order-btn" data-action="task-up" data-id="' + task.id + '"' + (idx===0?' disabled':'') + ' aria-label="Monter">▲</button>' +
          '<button class="order-btn" data-action="task-down" data-id="' + task.id + '"' + (idx===state.tasks.length-1?' disabled':'') + ' aria-label="Descendre">▼</button>' +
          '</div>' +
          '<button class="task-del" data-id="' + task.id + '" aria-label="Supprimer">×</button>' +
          '</div>';
      });
      html += '</div>';
      html += '<div class="task-foot">' + doneCount + ' sur ' + state.tasks.length + ' terminées aujourd\u2019hui' +
        (doneCount === state.tasks.length ? ' — bravo, série assurée pour aujourd\u2019hui.' : '') + ' · ta liste est la même chaque jour, seules les coches se réinitialisent.</div>';
    }

    html += renderTaskHistory(t);
    root.innerHTML = html;

    root.querySelectorAll('.task-text').forEach(autoGrow);
    root.querySelectorAll('.task-text').forEach(function(inp){
      inp.addEventListener('input', function(){
        var task = state.tasks.find(function(x){ return x.id === inp.dataset.id; });
        if (task) { task.text = inp.value; }
        autoGrow(inp);
        schedulePersist();
      });
    });

    var addBtn = document.getElementById('add-task-btn');
    var input = document.getElementById('new-task-input');
    function doAdd(){
      var v = input.value.trim();
      if (!v) return;
      state.tasks.push({id: uid(), text: v, createdAt: Date.now()});
      input.value = '';
      render();
      schedulePersist();
    }
    addBtn.addEventListener('click', doAdd);
    input.addEventListener('input', function(){ autoGrow(input); });

    root.querySelectorAll('.task-check').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.dataset.id;
        var tt = todayStr();
        if (!state.logs[tt]) state.logs[tt] = [];
        var idx = state.logs[tt].indexOf(id);
        if (idx >= 0) { state.logs[tt].splice(idx,1); }
        else { state.logs[tt].push(id); }
        updateStreakAfterToggle();
        render();
        schedulePersist();
      });
    });
    root.querySelectorAll('.task-del').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.dataset.id;
        var i = state.tasks.findIndex(function(x){ return x.id === id; });
        if (i >= 0) { trashItem('task', state.tasks[i], {index: i}); }
        state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
        render();
        schedulePersist();
      });
    });
    root.querySelectorAll('[data-action="task-up"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        moveItem(state.tasks, btn.dataset.id, -1);
        render();
        schedulePersist();
      });
    });
    root.querySelectorAll('[data-action="task-down"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        moveItem(state.tasks, btn.dataset.id, 1);
        render();
        schedulePersist();
      });
    });
  }

  function earliestActivityKey(){
    var keys = Object.keys(state.logs);
    state.tasks.forEach(function(t){ if (t.createdAt) keys.push(ymd(new Date(t.createdAt))); });
    if (keys.length === 0) return null;
    return keys.sort()[0];
  }

  function renderTaskHistory(todayKey){
    if (state.tasks.length === 0) return '';
    var first = earliestActivityKey();
    var days = [];
    for (var i = 1; i <= 3; i++) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var key = ymd(d);
      if (first && key < first) continue;
      days.push({key: key, date: d});
    }
    if (days.length === 0) return '';
    var html = '<div class="history-section"><div class="history-title">Historique</div>';
    days.forEach(function(day){
      var doneIds = state.logs[day.key] || [];
      html += '<div class="history-day"><div class="history-date">' + escapeHtml(fmtDateLong(day.date)) + '</div><div class="history-tasks">';
      state.tasks.forEach(function(task){
        var done = doneIds.indexOf(task.id) >= 0;
        html += '<span class="history-tag' + (done?' done':'') + '">' + (done?'✓ ':'') + escapeHtml(task.text) + '</span>';
      });
      html += '</div></div>';
    });
    html += '</div>';
    return html;
  }

  // ---------- Programme : calendrier ----------
  var progView = null; // {y, m, sel} - vue du calendrier, gardée sur cet appareil
  function loadProgView(){
    try {
      var raw = localStorage.getItem('quoti-prog-view');
      if (raw) {
        var v = JSON.parse(raw);
        if (v && typeof v.y === 'number' && typeof v.m === 'number' && /^\d{4}-\d{2}-\d{2}$/.test(v.sel || '')) { progView = v; return; }
      }
    } catch(e){}
    var n = new Date();
    progView = {y: n.getFullYear(), m: n.getMonth(), sel: ymd(n)};
  }
  function saveProgView(){
    try { localStorage.setItem('quoti-prog-view', JSON.stringify(progView)); } catch(e){}
  }
  function pad2(n){ return String(n).padStart(2, '0'); }

  function renderProgram(){
    var root = document.getElementById('tab-program');
    if (!progView) loadProgView();
    var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    var y = progView.y, m = progView.m, sel = progView.sel;
    var todayKey = todayStr();

    var counts = {};
    state.program.forEach(function(it){ if (it.date) counts[it.date] = (counts[it.date] || 0) + 1; });

    var offset = (new Date(y, m, 1).getDay() + 6) % 7; // semaine qui commence le lundi
    var daysInMonth = new Date(y, m + 1, 0).getDate();

    var html = '<div class="panel-head"><div><div class="panel-title">Programme</div>' +
      '<div class="panel-sub">Clique sur un jour pour y ajouter ce que tu as prévu</div></div>' +
      '<button class="btn ghost small" data-action="cal-today">Aujourd\u2019hui</button></div>';

    html += '<div class="cal-nav">' +
      '<button class="btn ghost small cal-arrow" data-action="cal-prev" aria-label="Mois précédent">‹</button>' +
      '<div class="cal-title">' + MOIS[m] + ' ' + y + '</div>' +
      '<button class="btn ghost small cal-arrow" data-action="cal-next" aria-label="Mois suivant">›</button></div>';

    html += '<div class="cal-grid">';
    ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].forEach(function(n){ html += '<div class="cal-dow">' + n + '</div>'; });
    for (var i = 0; i < offset; i++) html += '<div class="cal-cell cal-empty"></div>';
    for (var d = 1; d <= daysInMonth; d++) {
      var key = y + '-' + pad2(m + 1) + '-' + pad2(d);
      var cls = 'cal-cell cal-day' + (key === todayKey ? ' today' : '') + (key === sel ? ' selected' : '');
      var label = fmtDateLong(new Date(y, m, d)) + (counts[key] ? ', ' + counts[key] + ' prévu' + (counts[key] > 1 ? 's' : '') : '');
      html += '<button class="' + cls + '" data-day="' + key + '" aria-label="' + escapeHtml(label) + '">' +
        '<span class="cal-num">' + d + '</span>' + (counts[key] ? '<span class="cal-dot"></span>' : '') + '</button>';
    }
    var trail = (7 - ((offset + daysInMonth) % 7)) % 7;
    for (var t = 0; t < trail; t++) html += '<div class="cal-cell cal-empty"></div>';
    html += '</div>';

    var selDate = new Date(sel + 'T00:00:00');
    var items = state.program.filter(function(it){ return it.date === sel; });
    html += '<div class="day-panel"><div class="day-panel-title">' + escapeHtml(fmtDateLong(selDate)) + '</div>' +
      '<div class="program-add">' +
      '<textarea id="program-text-input" placeholder="Qu\u2019as-tu à faire ce jour-là ?" maxlength="500" rows="1"></textarea>' +
      '<button class="btn" id="program-add-btn">Ajouter</button></div>';
    if (items.length === 0) {
      html += '<div class="task-empty">Rien de prévu ce jour-là.</div>';
    } else {
      html += '<div class="task-list">';
      items.forEach(function(it){
        html += '<div class="program-row" data-id="' + it.id + '">' +
          '<input type="date" class="program-date" data-id="' + it.id + '" value="' + escapeHtml(it.date) + '">' +
          '<textarea class="program-text" data-id="' + it.id + '" rows="1">' + escapeHtml(it.text) + '</textarea>' +
          '<button class="task-del" data-action="del-program" data-id="' + it.id + '" aria-label="Supprimer">×</button>' +
          '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    root.innerHTML = html;

    root.querySelectorAll('.program-text').forEach(autoGrow);

    function goTo(ny, nm){
      var n = new Date(ny, nm, 1);
      var nowD = new Date();
      var isCurrent = (n.getFullYear() === nowD.getFullYear() && n.getMonth() === nowD.getMonth());
      progView = {y: n.getFullYear(), m: n.getMonth(), sel: isCurrent ? ymd(nowD) : ymd(n)};
      saveProgView();
      render();
    }
    root.querySelectorAll('[data-action="cal-prev"]').forEach(function(b){
      b.addEventListener('click', function(){ goTo(progView.y, progView.m - 1); });
    });
    root.querySelectorAll('[data-action="cal-next"]').forEach(function(b){
      b.addEventListener('click', function(){ goTo(progView.y, progView.m + 1); });
    });
    root.querySelectorAll('[data-action="cal-today"]').forEach(function(b){
      b.addEventListener('click', function(){ var n = new Date(); goTo(n.getFullYear(), n.getMonth()); });
    });
    root.querySelectorAll('[data-day]').forEach(function(b){
      b.addEventListener('click', function(){
        progView.sel = b.dataset.day;
        saveProgView();
        render();
      });
    });

    var textInput = document.getElementById('program-text-input');
    function doAdd(){
      var v = textInput.value.trim();
      if (!v) return;
      state.program.push({id: uid(), date: sel, text: v, done:false, createdAt: Date.now()});
      textInput.value = '';
      render();
      schedulePersist();
    }
    document.getElementById('program-add-btn').addEventListener('click', doAdd);
    textInput.addEventListener('input', function(){ autoGrow(textInput); });

    root.querySelectorAll('.program-date').forEach(function(inp){
      inp.addEventListener('change', function(){
        var it = state.program.find(function(x){ return x.id === inp.dataset.id; });
        if (it && inp.value) { it.date = inp.value; render(); schedulePersist(); }
        else { render(); }
      });
    });
    root.querySelectorAll('.program-text').forEach(function(inp){
      inp.addEventListener('input', function(){
        var it = state.program.find(function(x){ return x.id === inp.dataset.id; });
        if (it) { it.text = inp.value; }
        autoGrow(inp);
        schedulePersist();
      });
    });
    root.querySelectorAll('[data-action="del-program"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var pi = state.program.findIndex(function(x){ return x.id === btn.dataset.id; });
        if (pi >= 0) { trashItem('program', state.program[pi]); }
        state.program = state.program.filter(function(x){ return x.id !== btn.dataset.id; });
        render();
        schedulePersist();
      });
    });
  }

  function renderProgress(){
    var root = document.getElementById('tab-progress');
    var sportDays = Object.keys(state.sport.log).filter(function(d){ return state.sport.log[d]; }).length;
    var goalsLeft = ['short','mid','long'].reduce(function(sum, key){
      return sum + (state.goals[key] || []).filter(function(g){ return !g.done; }).length;
    }, 0);

    var html = '<div class="panel-head"><div><div class="panel-title">Progression</div>' +
      '<div class="panel-sub">Ta régularité en un coup d\u2019œil</div></div></div>';

    html += '<div class="stat-grid">' +
      '<div class="stat-box"><div class="stat-num">' + state.streak + '</div><div class="stat-label">Série actuelle</div></div>' +
      '<div class="stat-box"><div class="stat-num">' + state.longestStreak + '</div><div class="stat-label">Meilleure série</div></div>' +
      '<div class="stat-box"><div class="stat-num">' + sportDays + '</div><div class="stat-label">Jours de sport</div></div>' +
      '<div class="stat-box"><div class="stat-num">' + goalsLeft + '</div><div class="stat-label">Objectifs restants</div></div>' +
      '</div>';

    html += '<div class="backup-block">' +
      '<div class="panel-title backup-title">Sauvegarde</div>' +
      '<div class="panel-sub backup-sub">Exporte toutes tes données dans un fichier, ou restaure une sauvegarde.</div>' +
      '<div class="row backup-row">' +
      '<button class="btn ghost small" id="export-data-btn">Exporter mes données</button>' +
      '<label class="file-label">Importer des données<input type="file" id="import-data-input" accept=".json,application/json"></label>' +
      '</div></div>';

    html += '<div class="trash-block">' +
      '<div class="panel-title backup-title">Corbeille</div>' +
      '<div class="panel-sub backup-sub">Ce que tu supprimes reste ici ' + TRASH_DAYS + ' jours, au cas où.</div>';
    if (state.trash.length === 0) {
      html += '<div class="summary-empty">La corbeille est vide.</div>';
    } else {
      html += '<div class="trash-list">';
      state.trash.forEach(function(e){
        html += '<div class="trash-item"><div class="trash-main">' +
          '<div class="trash-text">' + escapeHtml(e.item.text) + '</div>' +
          '<div class="trash-meta">' + escapeHtml(trashLabel(e)) + '</div>' +
          '<div class="trash-meta">Supprimé le ' + new Date(e.deletedAt).toLocaleDateString('fr-FR') + '</div></div>' +
          '<button class="btn ghost small" data-action="restore" data-tid="' + e.tid + '">Restaurer</button></div>';
      });
      html += '</div><div class="row trash-actions"><button class="btn danger small" id="empty-trash-btn">Vider la corbeille</button></div>';
    }
    html += '</div>';

    root.innerHTML = html;

    root.querySelectorAll('[data-action="restore"]').forEach(function(b){
      b.addEventListener('click', function(){
        restoreFromTrash(b.dataset.tid);
        render();
        schedulePersist();
      });
    });
    var emptyBtn = document.getElementById('empty-trash-btn');
    if (emptyBtn) {
      emptyBtn.addEventListener('click', function(){
        if (!confirm('Supprimer définitivement tout le contenu de la corbeille ?')) return;
        state.trash = [];
        render();
        schedulePersist();
      });
    }

    document.getElementById('export-data-btn').addEventListener('click', function(){
      var json = JSON.stringify(state, null, 2);
      var stamp = todayStr();
      downloadFile('quoti-donnees-' + stamp + '.json', json, 'application/json;charset=utf-8;');
    });

    var importInput = document.getElementById('import-data-input');
    importInput.addEventListener('change', function(){
      var file = importInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        var parsed;
        try { parsed = JSON.parse(String(reader.result || '')); } catch(e) {
          alert('Ce fichier n\u2019est pas un fichier de données Quoti valide.');
          return;
        }
        if (!parsed || typeof parsed !== 'object') {
          alert('Ce fichier n\u2019est pas un fichier de données Quoti valide.');
          return;
        }
        var ok = confirm('Cela va remplacer toutes tes données actuelles par celles de ce fichier. Continuer ?');
        if (!ok) { importInput.value = ''; return; }
        state = normalizeState(parsed);
        render();
        schedulePersist();
      };
      reader.readAsText(file);
      importInput.value = '';
    });
  }

  function renderGoals(){
    var root = document.getElementById('tab-goals');
    var terms = [
      {key:'short', label:'Court terme'},
      {key:'mid', label:'Moyen terme'},
      {key:'long', label:'Long terme'}
    ];
    var html = '<div class="panel-head"><div><div class="panel-title">Tâches</div>' +
      '<div class="panel-sub">Court, moyen et long terme</div></div></div>';
    html += '<div class="goals-grid">';
    terms.forEach(function(term){
      var list = state.goals[term.key] || [];
      html += '<div class="goal-section"><div class="goal-heading-row"><div class="goal-heading">' + term.label + '</div>' +
        '<span class="goal-count">' + list.length + '</span></div>' +
        '<div class="goal-add"><textarea class="goal-input" data-term="' + term.key + '" placeholder="Ajouter un objectif…" maxlength="500" rows="1"></textarea>' +
        '<button class="btn small" data-action="add-goal" data-term="' + term.key + '">Ajouter</button></div>';
      if (list.length === 0) {
        html += '<div class="task-empty">Aucun objectif pour l\u2019instant.</div>';
      } else {
        html += '<div class="task-list">';
        list.forEach(function(g, idx){
          html += '<div class="task-row">' +
            '<button class="task-del" data-action="del-goal" data-term="' + term.key + '" data-id="' + g.id + '" aria-label="Supprimer">×</button>' +
            '<textarea class="task-text" data-term="' + term.key + '" data-id="' + g.id + '" rows="1">' + escapeHtml(g.text) + '</textarea>' +
            '<div class="order-controls">' +
            '<button class="order-btn" data-action="goal-up" data-term="' + term.key + '" data-id="' + g.id + '"' + (idx===0?' disabled':'') + ' aria-label="Monter">▲</button>' +
            '<button class="order-btn" data-action="goal-down" data-term="' + term.key + '" data-id="' + g.id + '"' + (idx===list.length-1?' disabled':'') + ' aria-label="Descendre">▼</button>' +
            '</div>' +
            '</div>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
    root.innerHTML = html;

    function addGoal(term, input){
      var v = input.value.trim();
      if (!v) return;
      state.goals[term].push({id: uid(), text: v, done:false, createdAt: Date.now()});
      input.value = '';
      render();
      schedulePersist();
    }
    root.querySelectorAll('[data-action="add-goal"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var term = btn.dataset.term;
        addGoal(term, root.querySelector('.goal-input[data-term="' + term + '"]'));
      });
    });
    root.querySelectorAll('.goal-input').forEach(function(inp){
      inp.addEventListener('input', function(){ autoGrow(inp); });
    });
    root.querySelectorAll('.task-text').forEach(autoGrow);
    root.querySelectorAll('.task-text').forEach(function(inp){
      inp.addEventListener('input', function(){
        var g = state.goals[inp.dataset.term].find(function(x){ return x.id === inp.dataset.id; });
        if (g) { g.text = inp.value; }
        autoGrow(inp);
        schedulePersist();
      });
    });
    root.querySelectorAll('[data-action="del-goal"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var term = btn.dataset.term, id = btn.dataset.id;
        var gi = state.goals[term].findIndex(function(x){ return x.id === id; });
        if (gi >= 0) { trashItem('goal', state.goals[term][gi], {term: term, index: gi}); }
        state.goals[term] = state.goals[term].filter(function(x){ return x.id !== id; });
        render();
        schedulePersist();
      });
    });
    root.querySelectorAll('[data-action="goal-up"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        moveItem(state.goals[btn.dataset.term], btn.dataset.id, -1);
        render();
        schedulePersist();
      });
    });
    root.querySelectorAll('[data-action="goal-down"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        moveItem(state.goals[btn.dataset.term], btn.dataset.id, 1);
        render();
        schedulePersist();
      });
    });
  }

  function renderSport(){
    var root = document.getElementById('tab-sport');
    var p = state.sport.profile;
    var today = todayStr();
    var doneToday = !!state.sport.log[today];
    var activeDays = Object.keys(state.sport.log).filter(function(d){ return state.sport.log[d]; }).length;

    var html = '<div class="panel-head"><div><div class="panel-title">Sport</div>' +
      '<div class="panel-sub">Ton programme à la maison</div></div></div>';

    html += '<div class="sport-form"><div class="form-grid">' +
      '<label>Taille (cm)<input type="number" id="sport-height" min="0" value="' + escapeHtml(p.height) + '"></label>' +
      '<label>Poids (kg)<input type="number" id="sport-weight" min="0" value="' + escapeHtml(p.weight) + '"></label>' +
      '<label>Âge<input type="number" id="sport-age" min="0" value="' + escapeHtml(p.age) + '"></label>' +
      '<label>Objectif<select id="sport-goal">' +
        Object.keys(GOAL_LABELS).map(function(k){ return '<option value="' + k + '"' + (p.goal===k?' selected':'') + '>' + GOAL_LABELS[k] + '</option>'; }).join('') +
      '</select></label>' +
      '<label>Niveau<select id="sport-level">' +
        Object.keys(LEVEL_LABELS).map(function(k){ return '<option value="' + k + '"' + (p.level===k?' selected':'') + '>' + LEVEL_LABELS[k] + '</option>'; }).join('') +
      '</select></label>' +
      '</div></div>';

    var bmi = computeBMI(p.height, p.weight);
    var tier = bmiTier(bmi);
    if (bmi) {
      html += '<div class="bmi-box">IMC <span class="bmi-num">' + bmi.toFixed(1) + '</span> · ' + bmiCategory(bmi) + '</div>';
    } else {
      html += '<div class="bmi-box bmi-box-muted">Renseigne ta taille et ton poids pour un programme ajusté à ton IMC.</div>';
    }

    var ids = buildRoutineIds(p.goal, tier);
    var meta = LEVEL_META[p.level] || LEVEL_META.debutant;
    html += '<div class="routine-block">' +
      '<div class="routine-meta">' + ids.length + ' exercices · ' + meta.rounds + ' séries · ' + meta.rest +
      (tier === 'impact_reduit' ? ' · mouvements à faible impact, adaptés à ton IMC' : '') + '</div>' +
      '<div class="exercise-list">';
    ids.forEach(function(id){
      var ex = EXERCISES[id];
      var dose = ex.dose[p.level] || ex.dose.debutant;
      var doseFull = meta.rounds + ' séries de ' + dose;
      html += '<div class="exercise-card"><div class="exercise-top">' +
        '<div><div class="exercise-name">' + ex.name + '</div><div class="exercise-muscle">' + ex.muscle + '</div></div>' +
        '<div class="exercise-dose">' + doseFull + '</div></div>' +
        '<div class="exercise-cue">' + ex.cue + '</div></div>';
    });
    html += '</div>';
    html += '</div>';

    var sportStreak = computeSportStreak();
    html += '<div class="sport-check-block">' +
      '<button class="btn' + (doneToday ? ' sport-done' : ' ghost') + '" id="sport-today-btn">' + (doneToday ? '✓ Fait aujourd\u2019hui' : 'Pas encore fait aujourd\u2019hui') + '</button>' +
      '<div class="sport-stat">' + sportStreak + ' jour' + (sportStreak===1?'':'s') + ' d\u2019affilée · ' + activeDays + ' jour' + (activeDays===1?'':'s') + ' actif' + (activeDays===1?'':'s') + ' au total</div>' +
      '</div>';

    root.innerHTML = html;

    function bindProfileField(id, field, numeric){
      var el = document.getElementById(id);
      el.addEventListener('input', function(){
        p[field] = el.value;
        schedulePersist();
      });
      el.addEventListener('change', function(){
        p[field] = el.value;
        render();
        schedulePersist();
      });
    }
    bindProfileField('sport-height', 'height');
    bindProfileField('sport-weight', 'weight');
    bindProfileField('sport-age', 'age');
    document.getElementById('sport-goal').addEventListener('change', function(e){
      p.goal = e.target.value; render(); schedulePersist();
    });
    document.getElementById('sport-level').addEventListener('change', function(e){
      p.level = e.target.value; render(); schedulePersist();
    });

    document.getElementById('sport-today-btn').addEventListener('click', function(){
      state.sport.log[today] = !state.sport.log[today];
      render();
      schedulePersist();
    });
  }

  var VALID_TABS = ['summary','tasks','program','goals','sport','progress'];
  function setActiveTab(tab){
    activeTab = tab;
    try { localStorage.setItem('quoti-active-tab', tab); } catch(e){}
  }

  // ---------- Init ----------
  function bindTabs(){
    document.getElementById('tabbar').addEventListener('click', function(e){
      var btn = e.target.closest('.tab-btn');
      if (!btn) return;
      setActiveTab(btn.dataset.tab);
      render();
    });
  }

  function flushOnHide(){
    document.addEventListener('visibilitychange', function(){ if (document.hidden) persist(); });
    window.addEventListener('pagehide', persist);
  }

  async function init(){
    state = loadInitialState();
    checkStreakDecay();

    try {
      var savedTab = localStorage.getItem('quoti-active-tab');
      if (savedTab && VALID_TABS.indexOf(savedTab) >= 0) activeTab = savedTab;
    } catch(e){}

    try {
      if (window.claude && typeof window.claude.use === 'function') {
        artifactNS = await window.claude.use('artifact');
        downloadsNS = await window.claude.use('downloads');
      }
    } catch(e) { /* no runtime available */ }

    if (!artifactNS) {
      try {
        var cached = localStorage.getItem('quoti-state-v1');
        if (cached) {
          var parsed = JSON.parse(cached);
          if (parsed && parsed.tasks) state = normalizeState(parsed);
        }
      } catch(e){}
    }
    purgeTrash();

    bindTabs();
    flushOnHide();
    render();
  }

  init();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(e){ console.error('SW registration failed', e); });
    });
  }
})();
</script>
